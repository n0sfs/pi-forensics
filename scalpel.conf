# Curated scalpel configuration for pi-forensics.
#
# scalpel's own stock config ships with every single file signature
# commented out - running scalpel against it recovers nothing at all,
# silently. This file enables a small, deliberately curated set of common
# formats rather than the full signature library, so results stay
# reviewable and predictable. Signature syntax (extension, case-sensitive,
# max size, header, [footer]) verified against scalpel's own upstream
# example config and multiple independent published copies of it.
#
# Add more lines yourself (same format) if you need additional types -
# this is a starting set, not an exhaustive one.

# extension    case_sensitive    max_size(bytes)    header                          footer

jpg            y                 200000000           \xff\xd8\xff\xe0\x00\x10        \xff\xd9
jpg            y                 200000000           \xff\xd8\xff\xe1                \xff\xd9

png            y                 20000000            \x50\x4e\x47\x0d\x0a\x1a\x0a    \x49\x45\x4e\x44\xae\x42\x60\x82

gif            y                 5000000             \x47\x49\x46\x38\x37\x61        \x00\x3b
gif            y                 5000000             \x47\x49\x46\x38\x39\x61        \x00\x00\x3b

pdf            y                 50000000            \x25\x50\x44\x46                \x25\x25\x45\x4f\x46

zip            y                 50000000            \x50\x4b\x03\x04
