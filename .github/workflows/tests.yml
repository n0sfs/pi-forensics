name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Only the lightweight subset of requirements.txt the currently
          # covered modules (core/*.py, routes/auth_routes.py,
          # routes/settings.py) actually need at import time - NOT the full
          # production requirements.txt, which also pulls in pytsk3/mvt/
          # reportlab (hardware-adjacent, no guaranteed prebuilt wheel on
          # every CI runner architecture, and not exercised by any test in
          # this suite yet - see CLAUDE.md's "hardware validation" open
          # items for what's still verified manually against the live
          # station instead). Keep these version floors in sync with
          # requirements.txt if those ever change.
          pip install "Flask>=3.0.0" "psutil>=5.8.0" "cryptography>=41.0.0"
          pip install -r requirements-dev.txt
      - name: Run test suite
        run: pytest -v
