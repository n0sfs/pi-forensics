name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the station: Debian trixie ships Python 3.13.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The full production list, the same one install.py installs. CI
          # used to install a hand-picked subset (Flask/psutil/cryptography),
          # which went stale as soon as a covered module imported anything
          # else - Markdown on 2026-08-23, then defusedxml, yara, pytsk3 and
          # python-evtx - and the suite has failed at collection ever since.
          # Every package here has an x86_64 wheel or builds from sdist on
          # the stock ubuntu runner (checked 2026-11-20 on Python 3.13).
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run test suite
        run: pytest -v
