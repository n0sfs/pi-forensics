# ============================================================================
# REFERENCE COPY - install.py writes this content inline (not from this
# file) to /etc/nginx/sites-available/pi-forensics when you accept the
# TLS setup prompt. This copy is here for review and as a manual-setup
# fallback if you want to configure the reverse proxy by hand. If you edit
# this file, note that install.py won't read your changes - update the
# nginx_conf string in install.py too if you want the change to persist
# across (re)installs.
# ============================================================================

# Pi Forensics Suite - TLS reverse proxy
# Authentication is enforced by app.py (not nginx) so the local kiosk and
# health checks on 127.0.0.1 work without an extra Basic-Auth prompt.

# HTTP -> HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS - SSL termination & reverse proxy to gunicorn
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/ssl/pi-forensics/pi-forensics.crt;
    ssl_certificate_key /etc/ssl/pi-forensics/pi-forensics.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Request bodies: just above the largest per-endpoint limit the app enforces
    # itself (core/config.py REQUEST_BODY_ENDPOINT_MAX_BYTES - a config restore,
    # 256 MiB). It used to be 0 (unlimited): nginx buffers a body to disk before
    # the app sees it, so one endless unauthenticated POST could fill the SD card.
    client_max_body_size 260m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Live acquisition progress streams without buffering delay
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
